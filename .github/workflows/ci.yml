name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  ci:
    uses: elixir-vibe/actions/.github/workflows/elixir-rustler-ci.yml@v1
    with:
      latest-command: mix compile --force --warnings-as-errors && mix ci
      min-command: mix compile --force --warnings-as-errors && mix test
      rust-cache-workspaces: |
        native -> target
